<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="How I work: sense, learn, control, ship, with feedback from control back to sensing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#14203d"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee" fill-opacity="0.75"/>
    </marker>
    <marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="18" fill="url(#bg)"/>
  <rect width="900" height="250" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="249" rx="17.5" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
  <rect x="30" y="34" width="186" height="118" rx="10" fill="#0f1a33" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#22d3ee">01</text>
  <text x="47" y="95" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#f8fafc">Sense</text>
  <text x="48" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">current, vibration and</text>
  <text x="48" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">acoustic signals</text>
  <line x1="220" y1="93.0" x2="244" y2="93.0" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="248" y="34" width="186" height="118" rx="10" fill="#0f1a33" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="266" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#22d3ee">02</text>
  <text x="265" y="95" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#f8fafc">Learn</text>
  <text x="266" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">models for noisy,</text>
  <text x="266" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">imbalanced data</text>
  <line x1="438" y1="93.0" x2="462" y2="93.0" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="466" y="34" width="186" height="118" rx="10" fill="#0f1a33" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="484" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#22d3ee">03</text>
  <text x="483" y="95" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#f8fafc">Control</text>
  <text x="484" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">predictive control that</text>
  <text x="484" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">tolerates model error</text>
  <line x1="656" y1="93.0" x2="680" y2="93.0" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="684" y="34" width="186" height="118" rx="10" fill="#0f1a33" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="702" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#22d3ee">04</text>
  <text x="701" y="95" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#f8fafc">Ship</text>
  <text x="702" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">systems that run</text>
  <text x="702" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">outside the lab</text>
  <path d="M559.0,156 C559.0,198 123.0,198 123.0,158" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-fault)" filter="url(#glow)"/>
  <text x="341.0" y="215" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#fb923c">FEEDBACK THROUGH THE MACHINE</text>
</svg>
